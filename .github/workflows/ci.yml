name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify every sequence against its published terms
        # The gate. Runs offline against the committed snapshot of the OEIS
        # data, so it does not silently stop working when the network does.
        run: oeisheadroom verify

      - name: Prove the gate can go red
        # A gate never observed failing is decoration. Corrupt one computed
        # term and require the same command to reject it -- otherwise a
        # verifier wired to `return True` would look identical to this one.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          d = pathlib.Path("sequences")
          mods = sorted(p for p in d.glob("a*.py"))
          if not mods:
              sys.exit("no sequence modules to sabotage")
          p = mods[0]
          src = p.read_text(encoding="utf-8")
          p.with_suffix(".py.bak").write_text(src, encoding="utf-8")
          # Wrap terms() so the first published value comes back wrong.
          src += "\n\n_orig_terms = terms\ndef terms(n_max):\n" \
                 "    out = list(_orig_terms(n_max))\n" \
                 "    if out: out[0] += 1\n    return out\n"
          p.write_text(src, encoding="utf-8")
          print(f"sabotaged {p.name}")
          PY
          if oeisheadroom verify; then
            echo "::error::the gate accepted a sequence with a corrupted term"
            exit 1
          fi
          echo "rejected, as it must be"
          python -c "import pathlib; d=pathlib.Path('sequences'); b=sorted(d.glob('a*.py.bak'))[0]; t=b.with_suffix(''); t.write_text(b.read_text(encoding='utf-8'), encoding='utf-8'); b.unlink()"
          oeisheadroom verify
