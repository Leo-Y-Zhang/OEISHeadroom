name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday morning. The confirmation job below needs the network and the OEIS
    # entries change on human timescales, so it runs on a schedule rather than
    # on every push, where it would only add a flaky dependency to the gate.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify every sequence against its published terms
        # The gate. Runs offline against the committed snapshot of the OEIS
        # data, so it does not silently stop working when the network does.
        run: oeisheadroom verify

      - name: Prove the gate can go red
        # A gate never observed failing is decoration. Corrupt one computed
        # term and require the same command to reject it -- otherwise a
        # verifier wired to `return True` would look identical to this one.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          d = pathlib.Path("sequences")
          mods = sorted(p for p in d.glob("a*.py"))
          if not mods:
              sys.exit("no sequence modules to sabotage")
          p = mods[0]
          src = p.read_text(encoding="utf-8")
          p.with_suffix(".py.bak").write_text(src, encoding="utf-8")
          # Wrap terms() so the first published value comes back wrong.
          src += "\n\n_orig_terms = terms\ndef terms(n_max):\n" \
                 "    out = list(_orig_terms(n_max))\n" \
                 "    if out: out[0] += 1\n    return out\n"
          p.write_text(src, encoding="utf-8")
          print(f"sabotaged {p.name}")
          PY
          if oeisheadroom verify; then
            echo "::error::the gate accepted a sequence with a corrupted term"
            exit 1
          fi
          echo "rejected, as it must be"
          python -c "import pathlib; d=pathlib.Path('sequences'); b=sorted(d.glob('a*.py.bak'))[0]; t=b.with_suffix(''); t.write_text(b.read_text(encoding='utf-8'), encoding='utf-8'); b.unlink()"
          oeisheadroom verify

  confirm:
    # Does the OEIS publish what this repository computed?
    #
    # This job could not exist before the extensions were accepted. It is not
    # the gate and must not be confused with it: the gate (above) runs offline
    # against the frozen pre-submission baseline and asks whether the code is
    # right. This asks whether the published record is right -- whether an
    # editor's trim, a b-file pasted a line off, or a submission built from a
    # stale run put a value into the OEIS that disagrees with the verified one.
    # Nothing inside this repository can notice that.
    #
    # It is deliberately not part of `test`: a network check wired into the
    # gate makes the gate stop running the day the network does. And it is
    # deliberately allowed to go red on an unreachable OEIS -- unconfirmed and
    # cannot-check must not look alike, which is the same rule the gate uses
    # for a module that will not import.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Confirm the published record against the verified terms
        run: oeisheadroom verify --live
