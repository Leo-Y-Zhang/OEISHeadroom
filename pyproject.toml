[project]
name = "oeisheadroom"
version = "0.1.0"
description = "Find OEIS sequences that stopped early because a brute force ran out of patience, then extend them."
readme = "README.md"
requires-python = ">=3.11"
# No dependencies. The survey is a regex pass over two gzipped text files and
# the sequence implementations are pure combinatorics; adding numpy would buy
# nothing and cost anyone who wants to re-run the verification.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
oeisheadroom = "oeisheadroom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oeisheadroom*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The sequence modules are verified artefacts: each is an independent
# implementation whose correctness is established by the gate reproducing every
# term the OEIS publishes. Their demo blocks use percent formatting. Restyling
# code whose only guarantee is that it currently computes the right numbers
# trades a real property for a cosmetic one, so the rule is scoped off here
# rather than the files being rewritten.
"sequences/*.py" = ["UP031"]
